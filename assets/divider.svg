<svg xmlns="http://www.w3.org/2000/svg" width="900" height="30" viewBox="0 0 900 30" role="img" aria-label="divider">
<title>divider</title>
<defs><style>
.serif{font-family:Cinzel, 'Cormorant Garamond', 'Trajan Pro', Georgia, 'Times New Roman', serif}
.mono{font-family:'JetBrains Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
@keyframes twinkle{0%,100%{opacity:.12}50%{opacity:.95}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes fadeup{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.tw{animation:twinkle 5s ease-in-out infinite}
.blink{animation:blink 1.1s steps(1) infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><linearGradient id="l" x1="0" x2="1"><stop offset="0" stop-color="#E8C66A" stop-opacity="0"/><stop offset="1" stop-color="#E8C66A" stop-opacity=".7"/></linearGradient><linearGradient id="r" x1="1" x2="0"><stop offset="0" stop-color="#E8C66A" stop-opacity="0"/><stop offset="1" stop-color="#E8C66A" stop-opacity=".7"/></linearGradient></defs>
<line x1="40" y1="15.0" x2="420.0" y2="15.0" stroke="url(#l)"/><line x1="480.0" y1="15.0" x2="860" y2="15.0" stroke="url(#r)"/><circle cx="428.0" cy="15.0" r="1.6" fill="#E8C66A" class="tw"/><circle cx="472.0" cy="15.0" r="1.6" fill="#E8C66A" class="tw" style="animation-delay:-2.5s"/><g style="transform-origin:450px 15px;animation:spin 40s linear infinite"><circle cx="450" cy="15" r="11" fill="none" stroke="#E8C66A" stroke-width=".8" opacity=".7"/><path d="M450 4L454.77 24.91L441.4 8.14L460.72 17.45L439.28 17.45L458.6 8.14L445.23 24.91L450 4Z" fill="none" stroke="#E8C66A" stroke-width=".8"/></g>
</svg>
