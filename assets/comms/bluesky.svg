<svg xmlns="http://www.w3.org/2000/svg" width="150" height="40" viewBox="0 0 150 40" role="img" aria-label="BLUESKY">
<title>BLUESKY</title>
<defs><style>
.serif{font-family:Cinzel, 'Cormorant Garamond', 'Trajan Pro', Georgia, 'Times New Roman', serif}
.mono{font-family:'JetBrains Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
@keyframes twinkle{0%,100%{opacity:.12}50%{opacity:.95}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes fadeup{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.tw{animation:twinkle 5s ease-in-out infinite}
.blink{animation:blink 1.1s steps(1) infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

@keyframes bar{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.bar{transform-box:fill-box;transform-origin:bottom;animation:bar 1.4s ease-in-out infinite}
</style></defs>
<rect x="1" y="1" width="148" height="38" rx="19.0" fill="#15112F" stroke="#5FE3D0" stroke-opacity=".7"/><rect class="bar" x="16.0" y="13" width="2.6" height="14" rx="1" fill="#5FE3D0" style="animation-delay:-0.17s"/><rect class="bar" x="20.5" y="13" width="2.6" height="14" rx="1" fill="#5FE3D0" style="animation-delay:-0.42s"/><rect class="bar" x="25.0" y="13" width="2.6" height="14" rx="1" fill="#5FE3D0" style="animation-delay:-0.67s"/><text x="90.0" y="24.5" text-anchor="middle" class="mono" font-size="11" letter-spacing="1.6" fill="#ECE6FF">BLUESKY</text>
</svg>
